services:
  app:
    container_name: docker-pug-app
    restart: always
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb+srv://rahulrajeevan:GYemjH8JTN5dc8X@cluster0.umtp6lq.mongodb.net/
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: docker-pug-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
