services:
  app:
    container_name: docker-pug-app
    restart: always
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGO_URI: "mongodb://root:example@mongo:27017/docker-pug?authSource=admin"
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    container_name: docker-pug-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: